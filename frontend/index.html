<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Attendance Monitoring System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    .badge-status-present { background-color: #198754; color: #fff; }
    .badge-status-late { background-color: #ffc107; color: #000; }
    .badge-status-absent { background-color: #dc3545; color: #fff; }
    .badge-status-excused { background-color: #0dcaf0; color: #000; }
    .badge-status-unknown { background-color: #6c757d; color: #fff; }
    
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <!-- Dynamic Application Root Shell -->
  <div id="app"></div>

  <!-- External Libraries: Axios & Bootstrap 5 Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Modular Portal Scripts -->
  <script src="js/student.js"></script>
  <script src="js/instructor.js"></script>
  <script src="js/admin.js"></script>
  
  <!-- Main Application Router & Shared State -->
  <script src="js/app.js"></script>
</body>
</html>
